<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F5FA">
<title>Mi Asistente Personal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* VOICE: asistente personal ordenado y exigente, cálido pero claro
   IDEA: una app nativa de bolsillo: una pantalla a la vez, menú fijo abajo
   PICTURE: tarjetas con cifras grandes, anillos y barras de progreso
   COLOUR: fondo gris claro; cada módulo con su color (verde, azul, naranja, morado)
   TYPE: Plus Jakarta Sans; LAYOUT: columna única de 480 px máx. con hoja inferior para formularios */
:root{color-scheme:light;--bg:#F4F5FA;--ink:#1B1D2B;--mut:#5E6278;--line:#ECEDF3;--c:#2E2A6E;--t:#E9E7FF;--ok:#0F7A4B;--okb:#DDF5E9;--bad:#B42318;--badb:#FDECEC;--warn:#9A6700;--warnb:#FFF4D6}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{font:15px/1.45 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--c);outline-offset:2px}
#view{max-width:480px;margin:0 auto;padding:18px 16px calc(110px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.sub{margin:0;font-size:13px;color:var(--mut);font-weight:500}
.ib{flex:none;width:46px;height:46px;border-radius:15px;border:0;display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:0 1px 2px rgba(27,29,43,.08)}
.ib:disabled{opacity:.35}
.ib.pri{background:var(--c);color:#fff;box-shadow:0 6px 16px rgba(27,29,43,.18)}
.card{background:#fff;border-radius:22px;padding:16px 18px;box-shadow:0 1px 2px rgba(27,29,43,.05),0 6px 20px rgba(27,29,43,.05)}
.cap{margin:0;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.lk{border:0;background:none;color:var(--c);font-weight:700;font-size:13.5px;min-height:40px;padding:0 2px}
.big{font-size:clamp(30px,9vw,38px);font-weight:800;letter-spacing:-.02em;line-height:1.1;white-space:nowrap}
.num{white-space:nowrap;font-variant-numeric:tabular-nums}
.demo{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#FFF4D6;color:#7A5200;border-radius:16px;padding:10px 12px 10px 14px;font-size:13.5px;font-weight:600}
.demo button{flex:none;border:0;border-radius:11px;background:#7A5200;color:#fff;font-weight:700;font-size:13px;min-height:38px;padding:0 12px}
.seg{display:flex;gap:4px;background:#E7E8F0;border-radius:14px;padding:4px}
.seg button{flex:1 1 auto;min-height:40px;border:0;border-radius:11px;background:transparent;font-weight:600;font-size:13px;color:#4A4E66;padding:0 6px;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(27,29,43,.12)}
.it{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:10px 0;min-height:60px;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.ic{flex:none;width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.it .tx{flex:1;display:flex;flex-direction:column;gap:1px}
.it b{font-weight:700;font-size:15px}
.it small{color:var(--mut);font-size:12.5px}
.it .rt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.chev{color:#A2A5B8;flex:none}
.dh{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 2px}
.dh:first-child{margin-top:0}
.bar{height:8px;border-radius:99px;background:#ECEDF3;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 9px;white-space:nowrap}
.btn{min-height:46px;border-radius:14px;border:0;font-weight:700;font-size:14px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--c);color:#fff}
.btn.soft{background:var(--t);color:var(--c)}
.btn.line{background:#fff;border:1.5px solid #DCDEE8;color:#4A4E66}
.btn.w{width:100%}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:#fff;border-radius:18px;padding:12px 4px;font-weight:700;font-size:13px;box-shadow:0 1px 2px rgba(27,29,43,.05),0 6px 20px rgba(27,29,43,.05)}
.empty{text-align:center;padding:22px 10px;color:var(--mut);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty .btn{margin-top:12px}
.stat{border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:12.5px;font-weight:600}
.stat b{font-size:22px;font-weight:800;white-space:nowrap}
.stat small{font-size:12px}
/* nav */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:calc(100% - 20px);max-width:460px;height:68px;background:#fff;border-radius:24px;box-shadow:0 8px 28px rgba(27,29,43,.15);display:flex;align-items:center;padding:0 4px;z-index:20}
#nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;font-size:10.5px;font-weight:700;color:#6B6F86}
#nav button svg{width:46px;height:28px;padding:3px 11px;border-radius:12px}
#nav button span{white-space:nowrap}
#nav button.on{color:var(--nc)}
#nav button.on svg{background:var(--nt)}
/* hoja */
#veil{position:fixed;inset:0;background:rgba(20,22,34,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#veil.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:480px;max-height:90vh;overflow:auto;overscroll-behavior:contain;background:#fff;border-radius:26px 26px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));transition:transform .25s ease,visibility 0s .25s;visibility:hidden;z-index:31}
#sheet.on{transform:translate(-50%,0);visibility:visible;transition:transform .25s ease}
.grab{width:42px;height:5px;border-radius:9px;background:#D6D8E4;margin:2px auto 12px}
#sheet h2{margin:0 0 4px;font-size:21px;font-weight:800}
#sheet .hint{margin:0 0 14px;color:var(--mut);font-size:13.5px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.f>label,.f>.lb{font-size:13px;font-weight:700;color:#4A4E66}
.f .note{font-size:12.5px;color:var(--mut)}
.in{font:500 16px 'Plus Jakarta Sans',sans-serif;border:1.5px solid #E1E3EC;border-radius:14px;padding:12px 14px;background:#F8F9FC;color:var(--ink);width:100%;min-height:48px}
.in:focus{border-color:var(--c);background:#fff;outline:none}
.in:is(textarea){resize:vertical;line-height:1.35}
.in.amt{font-size:28px;font-weight:800;padding:10px 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 14px;border-radius:99px;border:1.5px solid #E1E3EC;background:#fff;font-weight:600;font-size:14px;color:#4A4E66}
.chip.on{border-color:var(--c);background:var(--t);color:var(--c)}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:5px;border:1.5px solid transparent;background:#F6F7FB;border-radius:16px;padding:10px 2px 8px;font-size:12px;font-weight:600;color:#4A4E66}
.cat.on{border-color:var(--c);background:var(--t);color:var(--c)}
.cat .ic{width:36px;height:36px;border-radius:12px}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.danger{background:none;border:0;color:var(--bad);font-weight:700;min-height:46px}
.ghost{background:none;border:0;color:var(--mut);font-weight:600;min-height:44px}
.err{color:var(--bad);background:var(--badb);border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px;margin:0 0 10px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:#1B1D2B;color:#fff;padding:10px 10px 10px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .2s;z-index:40;width:max-content;max-width:calc(100% - 32px);display:flex;align-items:center;gap:12px}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{border:0;background:#3A3D55;color:#FFD66B;font-weight:700;border-radius:10px;min-height:36px;padding:0 12px}
#toast:not(.u){padding-right:16px}
.hab{display:flex;flex-direction:column;gap:10px}
.hab .hd{display:flex;align-items:center;gap:12px;border:0;background:none;text-align:left;padding:0;width:100%}
.hab .hd .tx{flex:1;display:flex;flex-direction:column}
.dot{flex:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.mk{display:flex;gap:8px}
.mk .btn{flex:1}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wk button{border:0;background:#fff;border-radius:14px;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;font-weight:700;color:var(--mut);position:relative}
.wk button b{font-size:18px;color:var(--ink)}
.wk button.on{background:var(--c);color:#dfe8ff}.wk button.on b{color:#fff}
.wk button.td:not(.on){box-shadow:inset 0 0 0 2px var(--c)}
.wk button i{position:absolute;bottom:7px;width:5px;height:5px;border-radius:50%;background:var(--c)}
.wk button.on i{background:#fff}
.ag{border-left:4px solid var(--c)}
.ag .hd{display:flex;justify-content:space-between;gap:8px;border:0;background:none;padding:0;width:100%;text-align:left}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;position:relative;margin-top:22px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.chart .col i{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:#D9CCFB}
.chart .col i.ok{background:#7C3AED}
.chart .col span{font-size:10.5px;font-weight:700;color:var(--mut)}
.chart .col em{font-style:normal;font-size:10px;font-weight:700;color:var(--mut)}
.goal{position:absolute;left:0;right:0;border-top:2px dashed #F97316;pointer-events:none}
.goal span{position:absolute;right:0;top:-18px;font-size:10.5px;font-weight:700;color:#C2410C;background:#fff;padding:0 4px}
.rep{background:#2E2A6E;color:#fff}
.rep p{margin:0 0 8px;font-size:14.5px;line-height:1.5}
.rep .cap{color:#FFD66B}
.sw{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:99px;background:#D6D8E4;position:relative;flex:none;margin:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.sw:checked{background:#2E2A6E}.sw:checked::after{left:23px}
label.it{cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="view"></main>
<nav id="nav"></nav>
<div id="veil"></div>
<div id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sb"></div></div>
<div id="toast" role="status"></div>
<script>
{
/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const KEY='mi-asistente-proto-v2';
const VER='2.5.4';
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const diffD=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const DOW=['dom','lun','mar','mié','jue','vie','sáb'], DOWL=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const cap1=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fdate=s=>{const d=pd(s);return DOW[d.getDay()]+' '+d.getDate()+' '+MES[d.getMonth()].slice(0,3)};
const flong=s=>{const d=pd(s);return cap1(DOWL[d.getDay()])+' '+d.getDate()+' de '+MES[d.getMonth()]};
const rel=s=>{const t=today();if(s===t)return'Hoy';if(s===addD(t,-1))return'Ayer';if(s===addD(t,1))return'Mañana';return cap1(fdate(s))};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf2=new Intl.NumberFormat('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf0=new Intl.NumberFormat('es-VE',{maximumFractionDigits:0});
const usdf=n=>(n<0?'−':'')+'$'+nf2.format(Math.abs(n));
const usd0=n=>(n<0?'−':'')+'$'+nf0.format(Math.abs(Math.round(n)));
const bsf=n=>(n<0?'−':'')+'Bs '+(Math.abs(n)<1000?nf2.format(Math.abs(n)):nf0.format(Math.abs(Math.round(n))));
const fm=(n,mon)=>mon==='USD'?usdf(n):bsf(n);
const uid=()=>Math.random().toString(36).slice(2,10);
const h12=t=>{if(!t)return'Todo el día';let [h,m]=t.split(':').map(Number);const ap=h<12?'a. m.':'p. m.';h=h%12||12;return h+':'+pad(m)+' '+ap};
const num=v=>{if(typeof v==='number')return v;let s=String(v||'').trim().replace(/\s|\$|Bs/gi,'');if(!s)return NaN;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return parseFloat(s)};
const ym=s=>s.slice(0,7);
const ymLabel=k=>{const [y,m]=k.split('-').map(Number);return cap1(MES[m-1])+' '+y};
const lastDay=(y,m)=>new Date(y,m+1,0).getDate();

const P={
 home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 wallet:'<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 habit:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
 trend:'<path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/>',
 plus:'<path d="M12 5v14M5 12h14"/>', back:'<path d="M15 18l-6-6 6-6"/>', chev:'<path d="M9 6l6 6-6 6"/>', left:'<path d="M15 6l-6 6 6 6"/>',
 check:'<path d="m5 12 5 5 9-10"/>', x:'<path d="M6 6l12 12M18 6 6 18"/>', clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>', repeat:'<path d="M17 3l3 3-3 3"/><path d="M4 12V10a4 4 0 0 1 4-4h12M7 21l-3-3 3-3"/><path d="M20 12v2a4 4 0 0 1-4 4H4"/>',
 up:'<path d="M12 19V5M6 11l6-6 6 6"/>', down:'<path d="M12 5v14M6 13l6 6 6-6"/>', swap:'<path d="M4 8h14l-3-3M20 16H6l3 3"/>',
 cart:'<path d="M3 4h2l2.4 11h11L21 8H6.2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/>',
 car:'<path d="M5 15l1.6-5.2A2 2 0 0 1 8.5 8.4h7a2 2 0 0 1 1.9 1.4L19 15"/><rect x="3" y="15" width="18" height="4" rx="1.5"/><path d="M6 19v2M18 19v2"/>',
 bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>', heart:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',
 star:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>', book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/>',
 house:'<path d="M4 11 12 4l8 7v9H4z"/><path d="M10 20v-5h4v5"/>', dots:'<circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/>',
 brief:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2M3 12h18"/>', tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/>',
 store:'<path d="M4 9h16l-1.5-5h-13z"/><path d="M5 9v11h14V9M10 20v-6h4v6"/>', gift:'<rect x="3" y="8" width="18" height="5" rx="1"/><path d="M5 13v8h14v-8M12 8v13M12 8C10 4 6 5 7.5 8M12 8c2-4 6-3 4.5 0"/>',
 bank:'<path d="M3 10h18L12 4z"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/>', cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
 phone:'<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>', target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
 spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/>',
 alert:'<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.5"/>', lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
 file:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>'
};
const I=(n,s=22,w=1.9)=>`<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${P[n]||''}</svg>`;

const CAT={
 gasto:[['comida','Comida','cart','#16A34A'],['transporte','Transporte','car','#EA580C'],['servicios','Servicios','bolt','#2563EB'],['casa','Casa','house','#0891B2'],['salud','Salud','heart','#DB2777'],['educacion','Educación','book','#7C3AED'],['ocio','Ocio','star','#CA8A04'],['otros_g','Otros','dots','#64748B']],
 ingreso:[['sueldo','Sueldo','brief','#0F7A4B'],['ventas','Ventas','tag','#0D9488'],['negocio','Negocio','store','#2563EB'],['regalo','Regalo','gift','#DB2777'],['otros_i','Otros','dots','#64748B']]
};
const catInfo=id=>{for(const t in CAT)for(const c of CAT[t])if(c[0]===id)return{id,n:c[1],ic:c[2],col:c[3]};return{id,n:'Transferencia',ic:'swap',col:'#2563EB'}};
const tint=hex=>hex+'1F';
const ACC={efectivo:['Efectivo','cash'],banco:['Banco','bank'],digital:['Digital','phone']};
const MOD={inicio:['#2E2A6E','#E9E7FF'],finanzas:['#0F7A4B','#DDF5E9'],agenda:['#2563EB','#DCE7FF'],habitos:['#EA580C','#FFE8D6'],evolucion:['#7C3AED','#EFE7FF'],ajustes:['#2E2A6E','#E9E7FF']};

/* ---------- datos ---------- */

 if(m.tipo==='ingreso'&&m.cuenta===c.id)s+=v;else if(m.tipo==='gasto'&&m.cuenta===c.id)s-=v;else if(m.tipo==='transfer'){if(m.cuenta===c.id)s-=v;if(m.destino===c.id)s+=v}}return s}

const mark=(h,s)=>(S.logs[s]||{})[h.id];

function vEvolucion(){const t=today(),N=UI.evo==='semana'?7:30,from=addD(t,-(N-1)),days=rng(from,t),st=stats(from,t),prev=stats(addD(from,-N),addD(from,-1));
 let h=hdr(`${cap1(fdate(from))} – ${fdate(t)}`,'Mi evolución',addBtn('newObj','Nuevo objetivo'))+demo();

 // informe
 const ps=[];
 if(st.pct===null)ps.push('Todavía no hay datos de hábitos en este periodo. Cuando marques tus hábitos unos días, aquí tendrás un informe real.');
 else{ps.push(`Cumpliste el <b>${st.pct} %</b> de tus hábitos (${st.ok} de ${st.n})${prev.pct!==null?`, ${st.pct>=prev.pct?'subiste':'bajaste'} ${Math.abs(st.pct-prev.pct)} puntos frente al periodo anterior`:''}. Tu meta es ${S.meta} %.`);
  const f=fallos(from,t)[0];if(f)ps.push(`Lo que más te frena: <b>«${esc(f.h.nombre)}»</b>, ${f.f} fallo${f.f>1?'s':''}${f.motivo?', casi siempre por '+esc(f.motivo.toLowerCase()):''}.`);
  const wd=[0,0,0,0,0,0,0],wn=[0,0,0,0,0,0,0];days.forEach(s=>{const x=dayStat(s);if(x&&(s<t||x.mk)){wd[pd(s).getDay()]+=x.ok;wn[pd(s).getDay()]+=x.n}});
  const rates=wd.map((v,i)=>wn[i]?v/wn[i]:null),valid=rates.map((r,i)=>[r,i]).filter(x=>x[0]!==null);
  if(valid.length>2){const lo=valid.sort((a,b)=>a[0]-b[0])[0];ps.push(`Tu día más flojo es el <b>${DOWL[lo[1]]}</b> (${Math.round(lo[0]*100)} %).`)}}
 let agT=0,agD=0;for(const s of days)for(const a of ofDay(s)){agT++;if(done(a,s))agD++}
 if(agT)ps.push(`Compromisos: hiciste ${agD} de ${agT}${vencidos().length?` y tienes ${vencidos().length} vencido${vencidos().length>1?'s':''}`:''}.`);
 const gN=S.movs.filter(m=>m.tipo==='gasto'&&m.fecha>=from&&m.fecha<=t).reduce((a,m)=>a+usd(m),0),gP=S.movs.filter(m=>m.tipo==='gasto'&&m.fecha>=addD(from,-N)&&m.fecha<from).reduce((a,m)=>a+usd(m),0);
 if(gN||gP)ps.push(`Gastaste ${usd0(gN)}${gP?` (${gN<=gP?Math.round((1-gN/gP)*100)+' % menos':Math.round((gN/gP-1)*100)+' % más'} que el periodo anterior)`:''}.`);
 let cierre='';if(st.pct!==null){const f=fallos(from,t)[0];cierre=st.pct>=S.meta?'Vas por encima de tu meta. No te relajes: sube la exigencia o agrega un hábito nuevo.':`Estás ${S.meta-st.pct} puntos por debajo de tu meta. No basta con planificar: hay que ejecutar.${f?` Mañana empieza por «${esc(f.h.nombre)}».`:''}`}
 h+=`<section class="card rep"><p class="cap" style="margin-bottom:8px">Informe ${UI.evo==='semana'?'de la semana':'del mes'}</p>${ps.map(p=>`<p>${p}</p>`).join('')}${cierre?`<p style="color:#FFD66B;font-weight:700;margin:0">${cierre}</p>`:''}</section>`;
 // gráfico
 h+=`<section class="card"><div class="ch"><p class="cap">Cumplimiento por día</p><span class="sub" style="display:inline-flex;align-items:center;gap:6px"><i style="width:16px;border-top:2px dashed #F97316"></i>meta ${S.meta} %</span></div><div class="chart" style="gap:${N>7?2:6}px"><div class="goal" style="bottom:${18+S.meta*1.16}px"></div>${days.map((s,i)=>{const x=dayStat(s),p=x&&(s<t||x.mk)?x.pct:null,lbl=N===7?DOW[pd(s).getDay()].charAt(0).toUpperCase():(i%5===0||s===t?pd(s).getDate():'');
  return`<div class="col">${N===7?`<em>${p===null?'—':p+'%'}</em>`:''}<i class="${p!==null&&p>=S.meta?'ok':''}" style="height:${p===null?2:Math.max(3,p*1.16)}px;${p===null?'background:#E5E7EF':''}"></i><span>${lbl}</span></div>`}).join('')}</div>
 <p class="sub" style="margin-top:10px;display:flex;gap:14px;flex-wrap:wrap"><span style="display:inline-flex;align-items:center;gap:6px"><i style="width:10px;height:10px;border-radius:3px;background:#7C3AED"></i>Llegó a la meta</span><span style="display:inline-flex;align-items:center;gap:6px"><i style="width:10px;height:10px;border-radius:3px;background:#D9CCFB"></i>Por debajo</span></p></section>`;

 h+=`<section class="card"><div class="ch"><p class="cap">Objetivos</p><button class="lk" style="color:#7C3AED" data-act="newObj">+ Nuevo</button></div>${S.objetivos.length?S.objetivos.map(o=>{const e=objEstado(o),pc=Math.round(o.actual/o.meta*100);
  return`<div style="padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px"><button class="hd" style="display:flex;justify-content:space-between;gap:8px;border:0;background:none;padding:0;text-align:left;width:100%" data-act="editObj" data-v="${o.id}"><span><b style="font-size:15.5px">${esc(o.nombre)}</b><br><small class="sub num">${objFmt(o,o.actual)} de ${objFmt(o,o.meta)} · hasta ${fdate(o.fecha)}</small></span><span class="pill" style="color:${e[1]};background:${e[2]};align-self:flex-start">${e[0]}</span></button>

function delItem(key,id,msg){const i=S[key].findIndex(x=>x.id===id);if(i<0)return;const [it]=S[key].splice(i,1);if(key==='movs'&&it.fijoId)syncFijo(it.fijoId);

 habDay:v=>{UI.habDay=addD(UI.habDay,+v);if(UI.habDay>today())UI.habDay=today();render(true)},
 habOk:v=>{const d=UI.habDay;(S.logs[d]=S.logs[d]||{})[v]={ok:true};const r=racha(S.habitos.find(x=>x.id===v));render(true);toast(r>1?`¡Bien! Racha de ${r} días`:'¡Bien hecho!',()=>{delete S.logs[d][v]})},
 habNo:v=>openForm('motivo',{hid:v,day:UI.habDay,nombre:S.habitos.find(x=>x.id===v).nombre,motivo:'',otro:''}),
 habUnmark:v=>openForm('marca',{hid:v,day:UI.habDay,nombre:S.habitos.find(x=>x.id===v).nombre}),
 mset:v=>{const d=F.d;if(v==='ok'){S.logs[d.day][d.hid]={ok:true};closeForm();render(true);toast('Marcado como cumplido')}else if(v==='clear'){delete S.logs[d.day][d.hid];closeForm();render(true);toast('Marca quitada')}else openForm('motivo',{hid:d.hid,day:d.day,nombre:d.nombre,motivo:'',otro:''})},
 newObj:()=>openForm('obj',{id:'',nombre:'',unidad:'$',unidadTxt:'',meta:'',actual:'',fecha:addD(today(),90)}),
 editObj:v=>{const o=S.objetivos.find(x=>x.id===v);openForm('obj',{...o,unidadTxt:['$','veces','libros','kg'].includes(o.unidad)?'':o.unidad})},
 objAv:v=>{const o=S.objetivos.find(x=>x.id===v);openForm('av',{oid:v,nombre:o.nombre,txt:objFmt(o,o.actual)+' de '+objFmt(o,o.meta),v:''})},
 copia:()=>{openForm('copia',{txt:JSON.stringify(S)});S.ultimaCopia=today();save()},restaurar:()=>openForm('restaurar',{txt:''}),
 copiarTxt:()=>{const t=$('#sheet textarea');t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}
  if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>toast('Copiado. Pégalo en WhatsApp (a ti mismo), Notas o un correo')).catch(()=>{if(!ok)toast('Mantén pulsado el texto → Seleccionar todo → Copiar')});else toast(ok?'Copiado. Pégalo en WhatsApp, Notas o un correo':'Mantén pulsado el texto → Seleccionar todo → Copiar')},
 bajarArch:()=>bajarCopia(),elegirArch:()=>subirCopia(),
 export:v=>toast(`El ${v} se genera en la app instalada en tu teléfono`),
 perfil:()=>openForm('perfil',{nombre:S.nombre,meta:S.meta}),
 limpiar:()=>openForm('confirm',{text:'Se borran los datos de ejemplo y empiezas con la app vacía, lista para tus datos reales.',label:'Empezar en limpio',run:()=>{const n=S.nombre,t=S.tasa;S=base();S.nombre=n;S.tasa=t;UI.finTab='mov';UI.habTab='hoy'}}),
 ejemplo:()=>openForm('confirm',{text:'Se reemplaza todo lo que tienes por datos de ejemplo.',label:'Cargar ejemplo',run:()=>{S=sample()}}),
 borrar:()=>openForm('confirm',{text:'Se borra todo: movimientos, cuentas, agenda, hábitos y objetivos. No se puede deshacer.',label:'Borrar todo',run:()=>{S=base();S.cuentas=[]}}),
 undo:()=>{if(undoFn){undoFn();undoFn=null;$('#toast').className='';render(true);toast('Deshecho')}},
 fclose:closeForm,
 fset:(v,el)=>{const k=el.dataset.k,d=F.d;
  if(el.dataset.m){const a=(d[k]||[]).map(String),i=a.indexOf(String(v));if(i>=0)a.splice(i,1);else a.push(String(v));d[k]=a}
  else d[k]=(k==='vtasa')?v:v;
  if(F.kind==='mov'){if(k==='tipo'){d.cat='';if(v==='transfer'){d.destino=(S.cuentas.find(c=>c.id!==d.cuenta)||{}).id;d.frec='una'}}
   if(k==='cat'&&v==='sueldo'&&d.frec==='una'&&!d.id){d.frec='mensual';d.dia=d.dia||pd(today()).getDate()}
   if(k==='frec'){if(v==='semanal')d.dia=String(pd(today()).getDay());if(v==='mensual')d.dia=pd(today()).getDate()}
   if(k==='cuenta'&&d.destino===v)d.destino=(S.cuentas.find(c=>c.id!==v)||{}).id;
   if(k==='cuenta'&&d.tipo!=='transfer'&&!(num(d.monto)>0)){const c=acc(v);if(c)d.moneda=c.moneda}}
  if(F.kind==='fijo'){if(k==='tipo')d.cat='';if(k==='frec'){if(v==='semanal')d.dia=String(pd(today()).getDay());if(v==='mensual')d.dia=pd(today()).getDate()}}
  if(F.kind==='hab'&&k==='preset')d.dias=v==='all'?['1','2','3','4','5','6','0']:v==='lv'?['1','2','3','4','5']:['6','0'];
  if(F.kind==='obj'&&k==='unidad'&&v==='otra')d.unidad='';
  if(F.kind==='pos'&&k==='q'){const a=S.agenda.find(x=>x.id===d.aid);if(v==='1h'){const n=new Date();n.setHours(n.getHours()+1);d.fecha=ymd(n);d.hora=pad(n.getHours())+':'+pad(n.getMinutes())}if(v==='tarde'){d.fecha=today();d.hora='18:00'}if(v==='man'){d.fecha=addD(today(),1);d.hora=a.hora||'09:00'}}
  F.err='';drawForm()},
 fsave:()=>{try{const nuevo=!F.d.id,msg=FD[F.kind].save(F.d);const k=F.kind;closeForm();
   const dest={hab:'habitos',ag:'agenda',obj:'evolucion',mov:'finanzas',fijo:'finanzas',cuenta:'finanzas',presu:'finanzas',reg:'finanzas'}[k];
   if(dest&&nuevo){if(k==='cuenta')UI.finTab='cue';else if(k==='presu')UI.finTab='pre';else if(dest==='finanzas')UI.finTab='mov';if(k==='hab'){UI.habTab='hoy';UI.habDay=today()}
    if(UI.scr!==dest){UI.scr=dest;try{history.replaceState(null,'','#'+dest)}catch(e){}render();window.scrollTo(0,0)}else render(true)}else render(true);
   if(msg&&msg!=='keep')toast(msg)}catch(e){if(typeof e!=='string')console.error(e);F.err=typeof e==='string'?e:'Revisa los datos.';drawForm();const er=$('#sb .err');if(er){er.scrollIntoView({block:'center',behavior:'smooth'});er.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:280})}}},
 fdel:()=>{const r=FD[F.kind].del(F.d);if(r==='keep'){return}closeForm();render(true)}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const fn=A[el.dataset.act];if(fn){e.preventDefault();fn(el.dataset.v,el)}});
document.addEventListener('input',e=>{const el=e.target;if(F&&el.dataset&&el.dataset.k&&el.closest('#sheet')){F.d[el.dataset.k]=el.value;if(F.kind==='mov'){const c=$('#conv');if(c)c.textContent=convTxt(F.d)}if(F.kind==='pos'&&F.d.q){F.d.q='';$$('#sheet .chip.on').forEach(c=>c.classList.remove('on'))}}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.pref){S.prefs[el.dataset.pref]=el.checked;save();toast(el.checked?'Activado':'Desactivado')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&F)closeForm();if(e.key==='Enter'&&F&&e.target.matches('input.in')&&e.target.type!=='date'&&e.target.type!=='time'){e.preventDefault();A.fsave()}});
$('#veil').addEventListener('click',closeForm);
S.fijos.forEach(f=>syncFijo(f.id));
lastJ=sinG();
render();
initNube();
}
</script>
</body>
